<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>卫华 3D 方案工作台</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<!-- The 3D site fills the whole window; every panel floats over it. -->
<div class="stage" id="view">
  <canvas id="canvas"></canvas>
  <div id="labels"></div>
  <div class="loading" id="loading">正在加载…</div>
  <div class="toast" id="toast" hidden></div>
  <button class="restore" id="restoreBtn" title="显示面板 (H)">显示面板</button>
</div>

<header class="top glass">
  <div class="brand">
    <div class="mark">卫</div>
    <div class="ttl">
      <b>卫华 3D 方案工作台</b>
      <nav class="steps" id="steps">
        <button class="step" data-step="1"><i>1</i>图纸点位</button>
        <button class="step" data-step="2"><i>2</i>选型参数</button>
        <button class="step" data-step="3"><i>3</i>流程说明</button>
        <button class="step" data-step="4"><i>4</i>流程动画</button>
        <button class="step" data-step="5"><i>5</i>效率节拍</button>
        <button class="step" data-step="6"><i>6</i>行程可视化</button>
        <button class="step later" data-step="7"><i>7</i>出图下发</button>
      </nav>
    </div>
  </div>
  <span class="runst" id="runSt">运行中</span>
  <div class="kpibar" id="kpis"></div>
  <div class="clock"><b class="num" id="clock">00:00</b><small class="num" id="clockTotal">/ 00:00</small></div>
  <div class="acts-top">
    <button id="clearBtn" title="清屏 (H)">清屏</button>
    <button id="resetBtn">复位</button>
    <button id="shotBtn">截图</button>
    <button id="recBtn">录制</button>
  </div>
</header>

<aside class="left">
  <section class="panel glass grow min-on" id="secProcess">
    <header class="ph"><b><i>01</i>工序流程</b><span class="num" id="procTotal"></span><button class="min" data-min title="缩小 / 展开"></button></header>
    <ol class="proclist" id="procList"></ol>
  </section>
  <section class="panel glass lib min-on" id="secLibrary" data-card-alias="secCases secProducts secFactory">
    <header class="ph">
      <b class="ptl"><i>02</i><span class="pname" id="projTitle">冷轧车间 AGV + 行车方案</span></b>
      <button type="button" class="scnsel" id="sceneSel" title="切换场景">主场景</button>
      <button class="min" data-min title="缩小 / 展开"></button>
    </header>
    <div class="libbody tree" id="libBody" tabindex="-1"></div>
    <div class="libhint">拖拽或右键整理 · 上传文件在右边对小华说</div>
  </section>
</aside>

<aside class="right">
  <section class="panel glass viewbar">
    <div class="seg" id="views">
      <button data-view="overview" class="on">总览</button><button data-view="follow">跟随</button><button data-view="top">俯视</button>
    </div>
    <div class="seg">
      <button id="rotateBtn" class="on">旋转</button><button id="travelBtn">轨迹</button><button id="labelBtn" class="on">标签</button>
    </div>
    <div class="seg"><button id="keysBtn" title="犀牛 Rhino 习惯的快捷键 (F1)">快捷键</button></div>
    <div class="seg"><button data-open-dashboard title="钢卷加工指挥大屏">可视化大屏</button></div>
  </section>
  <section class="panel glass devcard min-on" id="secDevice">
    <header class="ph"><b><i>03</i>设备卡</b><span class="num" id="hudWindow">--</span><button class="min" data-min title="缩小 / 展开"></button></header>
    <div class="dc">
      <div class="dct"><span class="no num" id="hudNo">01</span><b id="hudTitle">正在加载厂房…</b><span class="badge" id="hudDev">AGV</span></div>
      <div class="bar"><span id="hudBar"></span></div>
      <div class="metrics" id="hudRow"></div>
      <div class="chips" id="hudChips"></div>
      <div class="coord" id="coord"></div>
    </div>
  </section>
  <section class="panel glass agent min-on" id="secAgent">
    <div class="ahead">
      <div class="avatar">华</div>
      <b>小华 · 方案助手</b>
      <span class="st" id="llmStatus">连接中</span>
      <button class="min" data-min title="缩小 / 展开"></button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="input">
      <div class="sugg" id="sugg"></div>
      <div class="attach" id="attach" hidden></div>
      <form class="box" id="form">
        <label class="clip" title="上传文件（可多选）：DXF · DWG · GLB · OBJ · STL · STEP · FBX · 图片">
          <input type="file" id="chatFiles" multiple hidden />
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9"/></svg>
        </label>
        <textarea id="prompt" rows="1" placeholder="说一句话，场景跟着变；也可以拖入或粘贴文件"></textarea>
        <button class="send" id="send" type="submit" title="发送">➤</button>
      </form>
    </div>
  </section>
</aside>

<section class="drawer panel glass" id="drawer" hidden>
  <button class="pop" data-pop title="弹出放大"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4M13.5 2.5 8.5 7.5M6.5 13.5h-4v-4M2.5 13.5l5-5"/></svg></button>
  <button class="x" id="drawerClose" title="收起">✕</button>
  <div class="dockmain" id="dockMain"></div>
</section>

<section class="bottom glass">
  <div class="ctl">
    <button class="pbtn" id="playBtn">❚❚ 暂停</button>
    <div class="speeds" id="speeds">
      <button data-speed="0.5">0.5×</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4" class="on">4×</button><button data-speed="8">8×</button>
    </div>
    <button class="link" id="allBtn">全流程</button>
    <button class="link" id="nextBtn">下一步 ▸</button>
    <span class="sep"></span>
    <div class="tabs" id="tabs">
      <button data-tab="scene" class="scene-only">识别结果</button>
      <button data-tab="gantt">甘特图</button>
      <button data-tab="process">工序表</button>
      <button data-tab="points">点位表</button>
      <button data-tab="params">选型参数</button>
      <button data-tab="eff">效率节拍</button>
      <button data-tab="travel">行程统计</button>
      <button data-tab="slots">货位库存</button>
      <button data-tab="flow">工艺流程</button>
      <button data-tab="linesim">产线仿真</button>
    </div>
    <div class="legend">
      <span><s style="background:#2B7DE9"></s>载货</span>
      <span><s style="background:#2EA121"></s>空车</span>
      <span><s style="background:#D7000F"></s>吊运</span>
    </div>
    <div class="proj"><span id="source">—</span><span class="tag num" id="version">v1</span></div>
  </div>
  <div class="tl">
    <div class="segs" id="tl"></div>
    <input type="range" id="scrub" min="0" max="1000" value="0" />
  </div>
</section>
<script type="module" src="/src/main.js"></script>
</body>
</html>
